<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plain Days — Week 02</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<header>
<div class="logo">PLAIN DAYS</div>
<h1>WEEK.02</h1>
<p>little conversations<br>with my week.</p>
</header>
<main class="memory-board">
<div class="sticker spider" data-message="스파이더맨 보러 왔다 🕷️\n오랜만에 영화관 와서 좋았어."><img src="../images/week02/spiderman.png"></div>
<div class="sticker gamjatang" data-message="남편이랑 같이 먹은 감자탕.\n같이 밥 먹는 시간이 참 좋았다."><img src="../images/week02/food_gamjatang.png"></div>
<div class="sticker gwangheo" data-message="내가 직접 만든\n깻잎 들기름 광어무침 🤍"><img src="../images/week02/gwangheo.png"></div>
<div class="sticker pasta" data-message="남편이 만들어준 봉골레 파스타.\n같이 요리하는 시간이 좋았다."><img src="../images/week02/pasta.png"></div>
<div class="sticker soju" data-message="맛있는 음식과 함께한\n작은 저녁 시간."><img src="../images/week02/soju.png"></div>
<div class="sticker starbucks" data-message="일과 삶이 너무 붙어있는 것 같아서\n혼자만의 시간을 가지러 나왔다."><img src="../images/week02/starbucks.png"></div>
<div class="sticker handwash" data-message="향이 너무 좋아서\n기억하고 싶었던 작은 취향."><img src="../images/week02/handwash.png"></div>
</main>
<section class="chat-box"><div class="chat-title">What do you want to remember today?</div><div id="messages"></div></section>
</div>
<script src="script.js"></script>
</body>
</html>
