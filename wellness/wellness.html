<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellness — Plain Days</title>
  <link rel="stylesheet" href="wellness.css">
</head>
<body class="wellness-page">
  <main class="wellness-shell">
    <header class="wellness-topbar">
      <a href="https://plain-days.com/" target="_top" class="wellness-back">
        <span>←</span><span>PLAIN DAYS</span>
      </a>
      <span class="wellness-index">WELLNESS / 02</span>
    </header>

    <section class="wellness-heading">
      <div>
        <span class="wellness-kicker">LITTLE WELLNESS</span>
        <h1>August</h1>
        <p>one healthy thing,<br>every day.</p>
      </div>
      <div class="month-chip">2026</div>
    </section>

        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>

        <a href="https://www.instagram.com/plaindays.co/" target="_blank" rel="noopener noreferrer" class="wellness-day day-photo">
          <span class="day-number">1</span><img src="image/wellness-01.jpg" alt="Wellness moment August 1">
        </a>
        <a href="#" class="wellness-day day-symbol sage"><span class="day-number">2</span><span class="day-emoji">☀</span></a>
        <div class="wellness-day day-symbol aqua"><span class="day-number">3</span><span class="day-emoji">🍵</span></div>
        <a href="#" class="wellness-day day-photo"><span class="day-number">4</span><img src="image/wellness-04.jpg" alt="Wellness moment August 4"></a>

        <a href="#" class="wellness-day day-symbol sky"><span class="day-number">6</span><span class="day-emoji">🫐</span></a>
